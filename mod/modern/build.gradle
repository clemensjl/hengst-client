// Shared build script for every Stonecutter version node (versions/<mc>/).
// 1.21.11 is obfuscated and needs the remapping Loom plugin; 26.3 is unobfuscated.
// Version and group come from mod/gradle.properties, the single source for all three builds.
def shared = new Properties()
file("${rootDir}/../gradle.properties").withInputStream { shared.load(it) }

def remap = project.property('loom_remap').toBoolean()
apply plugin: remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

group = shared.maven_group
version = "${shared.mod_version}+${project.minecraft_version}"

base {
    archivesName = 'hengst-mod'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (remap) {
        mappings loom.officialMojangMappings()
    }
    add(remap ? 'modImplementation' : 'implementation', 'net.fabricmc:fabric-loader:0.20.1')
    add(remap ? 'modImplementation' : 'implementation', "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    implementation "${shared.maven_group}:common:${shared.mod_version}"
    include "${shared.maven_group}:common:${shared.mod_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    // Minimum Fabric API: the version this node is built against, without its "+<mc>" build metadata.
    def fabricApiMin = project.fabric_api_version.split('\\+')[0]
    def props = [version: project.version, minecraft_version: project.minecraft_version, java_release: project.java_release,
                 fabric_api_min: fabricApiMin]
    inputs.properties props

    filesMatching(['fabric.mod.json', 'hengst.mixins.json']) {
        expand props
    }
}

test {
    useJUnitPlatform()
    // The game's log4j config on the test classpath writes logs/ into the working directory: keep that in build/.
    def testRunDir = layout.buildDirectory.dir('test-run').get().asFile
    workingDir = testRunDir
    doFirst { testRunDir.mkdirs() }
}

// In-game test (Fabric client gametest, source set src/gametest). Not part of build, check or test, not in the jar.
//   runClientGameTest         fresh run directory (build/run/clientGameTest), the full check list
//   runClientGameTestRestart  same run directory kept, checks that the layout saved by the first run is loaded
//   clientGameTests           both, in that order
// Screenshots: build/run/clientGameTest/screenshots. A failed assertion crashes the client and fails the task.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'hengst-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}

loom {
    runs {
        clientGameTestRestart {
            inherit clientGameTest
            // inherit does not copy the run directory
            runDir 'build/run/clientGameTest'
            property 'hengst.gametest.phase', 'restart'
        }
    }
}

def gameTestRunDir = file('build/run/clientGameTest')
def muteGameTestSound = tasks.register('muteGameTestSound') {
    description = 'Sets the master volume to 0 in the client gametest run directory before the game starts.'
    mustRunAfter 'deleteGameTestRunDir'
    outputs.upToDateWhen { false }
    doLast {
        gameTestRunDir.mkdirs()
        def options = new File(gameTestRunDir, 'options.txt')
        def lines = options.exists() ? options.readLines('UTF-8').findAll { !it.startsWith('soundCategory_master:') } : []
        lines << 'soundCategory_master:0.0'
        options.write(lines.join('\n') + '\n', 'UTF-8')
    }
}
tasks.named('runClientGameTest') {
    dependsOn muteGameTestSound
}
tasks.named('runClientGameTestRestart') {
    dependsOn muteGameTestSound
    mustRunAfter 'runClientGameTest'
}
tasks.register('clientGameTests') {
    group = 'verification'
    description = 'Runs the in-game test twice: fresh run directory, then a restart with the saved layout.'
    dependsOn 'runClientGameTest', 'runClientGameTestRestart'
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_release as int
    options.encoding = 'UTF-8'
}
