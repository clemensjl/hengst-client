// Shared build script for every Stonecutter version node (versions/<mc>/).
// 1.21.11 is obfuscated and needs the remapping Loom plugin; 26.3 is unobfuscated.
// Version and group come from mod/gradle.properties, the single source for all three builds.
def shared = new Properties()
file("${rootDir}/../gradle.properties").withInputStream { shared.load(it) }

def remap = project.property('loom_remap').toBoolean()
apply plugin: remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

group = shared.maven_group
version = "${shared.mod_version}+${project.minecraft_version}"

base {
    archivesName = 'hengst-mod'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (remap) {
        mappings loom.officialMojangMappings()
    }
    add(remap ? 'modImplementation' : 'implementation', 'net.fabricmc:fabric-loader:0.20.1')
    add(remap ? 'modImplementation' : 'implementation', "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    implementation "${shared.maven_group}:common:${shared.mod_version}"
    include "${shared.maven_group}:common:${shared.mod_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version, java_release: project.java_release]
    inputs.properties props

    filesMatching(['fabric.mod.json', 'hengst.mixins.json']) {
        expand props
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_release as int
    options.encoding = 'UTF-8'
}
