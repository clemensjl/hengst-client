plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16.1'
    // Must match the Loom version above (Legacy Looming 1.16.x builds on Loom 1.16).
    id 'legacy-looming' version '1.16.1'
}

// Version and group come from mod/gradle.properties, the single source for all three builds.
def shared = new Properties()
file("${rootDir}/../gradle.properties").withInputStream { shared.load(it) }

group = shared.maven_group
version = "${shared.mod_version}+1.8.9"

base {
    archivesName = 'hengst-mod'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings legacy.yarn('1.8.9', '604')
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.legacyfabric.legacy-fabric-api:legacy-fabric-api:1.13.5+1.8.9'

    implementation "${shared.maven_group}:common:${shared.mod_version}"
    include "${shared.maven_group}:common:${shared.mod_version}"
}

processResources {
    def props = [version: project.version]
    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}
