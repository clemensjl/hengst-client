plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16.1'
    // Must match the Loom version above (Legacy Looming 1.16.x builds on Loom 1.16).
    id 'legacy-looming' version '1.16.1'
}

group = project.maven_group
version = "${project.mod_version}+1.8.9"

base {
    archivesName = 'hengst-mod'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings legacy.yarn('1.8.9', '604')
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.legacyfabric.legacy-fabric-api:legacy-fabric-api:1.13.5+1.8.9'

    implementation 'io.github.clemensjl.hengst:common:0.1.0'
    include 'io.github.clemensjl.hengst:common:0.1.0'
}

processResources {
    def props = [version: project.version]
    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}
