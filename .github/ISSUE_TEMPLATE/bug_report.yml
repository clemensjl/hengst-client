name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command, for example `hengst launch 1.21.11 --dry-run`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hengst version or commit
      description: Output of `hengst --version`, or the commit hash if built from source.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Paste the terminal output. Remove tokens and account data first.
      render: shell
