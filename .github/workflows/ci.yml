name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  prepare-matrix:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: [rd-132211, a1.2.6, b1.7.3, 1.2.5, 1.5.2, 1.7.10, 1.8.9, 1.12.2, 1.16.5, 1.20.4, 1.21.11, latest, latest-snapshot]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p hengst-cli -- --home "${{ runner.temp }}/hengst" launch ${{ matrix.version }} --dry-run
