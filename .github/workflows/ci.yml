name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p hengst-core --lib
      # Without features: the release-only branches (no dev account listed, real services) run.
      - run: cargo test -p hengst-desktop
      # The release configuration `tauri build` compiles (the placeholder dist is enough to check it).
      - run: cargo check --release -p hengst-desktop --features custom-protocol
      # The e2e feature must never compile into a release build, and it must fail for that reason.
      - shell: bash
        run: |
          if out=$(cargo check --release -p hengst-desktop --features custom-protocol,e2e 2>&1); then
            echo "the e2e feature compiled in a release build"
            exit 1
          fi
          if ! echo "$out" | grep -F 'the `e2e` feature is for debug builds only'; then
            echo "$out"
            echo "the release build failed, but not because of the e2e guard"
            exit 1
          fi

  msrv:
    # The core and the CLI promise Rust 1.89; the desktop crate needs 1.90 and is left out.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p hengst-core -p hengst-cli

  desktop-frontend:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/desktop/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm -C apps/desktop install --frozen-lockfile
      - run: pnpm -C apps/desktop typecheck
      # Includes licenses.test.ts: it hashes the lock files, about.toml and the generator, so a stale
      # third-party license list fails here without cargo-about on the runner.
      - run: pnpm -C apps/desktop test
      - run: pnpm -C apps/desktop format:check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The app as `tauri build` makes it (frontend from beforeBuildCommand, custom-protocol), debug,
      # without installers. Output stays in target/, which is git-ignored; the app is not started.
      - run: pnpm -C apps/desktop tauri build --debug --no-bundle

  prepare-matrix:
    # Hits live third-party services and "latest" moves upstream: weekly and on demand only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: [rd-132211, a1.2.6, b1.7.3, 1.2.5, 1.5.2, 1.7.10, 1.8.9, 1.12.2, 1.16.5, 1.20.4, 1.21.11, latest, latest-snapshot]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p hengst-cli -- --home "${{ runner.temp }}/hengst" launch ${{ matrix.version }} --offline Dev --dry-run

  loader-matrix:
    # Hits live third-party services and "latest" moves upstream: weekly and on demand only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: fabric, version: 1.21.11 }
          - { loader: fabric, version: latest }
          - { loader: quilt, version: 1.21.11 }
          - { loader: legacy-fabric, version: 1.8.9 }
          - { loader: legacy-fabric, version: 1.12.2 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p hengst-cli -- --home "${{ runner.temp }}/hengst" launch ${{ matrix.version }} --loader ${{ matrix.loader }} --offline Dev --dry-run

  resolve-matrix:
    # Pull requests only: the cheap counterpart of prepare-matrix and loader-matrix. `--resolve-only`
    # fetches the version manifest and the loader version lists and nothing else (no libraries,
    # assets, installers, account or Java). "latest" and the loader lists move upstream, so a
    # failure here can come from upstream rather than from the change. No secrets are used, so it
    # runs the same on pull requests from forks.
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p hengst-cli
      - env:
          HOME_DIR: ${{ runner.temp }}/hengst
        # The list mirrors the entries of prepare-matrix and loader-matrix (plus one Forge and one
        # NeoForge pick): keep the three in sync.
        run: |
          check() {
            local args=(launch "$1" --resolve-only)
            if [ -n "$2" ]; then args+=(--loader "$2"); fi
            echo "hengst ${args[*]}"
            # stdin is the list below: hengst must not read from it.
            target/debug/hengst --home "$HOME_DIR" "${args[@]}" < /dev/null
          }
          failures=()
          while read -r version loader; do
            if check "$version" "$loader"; then continue; fi
            # Live third-party services: one retry after a pause.
            echo "failed, retrying in 10 s"
            sleep 10
            if ! check "$version" "$loader"; then failures+=("$version${loader:+ $loader}"); fi
          done <<'EOF'
          rd-132211
          a1.2.6
          b1.7.3
          1.2.5
          1.5.2
          1.7.10
          1.8.9
          1.12.2
          1.16.5
          1.20.4
          1.21.11
          latest
          latest-snapshot
          1.21.11 fabric
          latest fabric
          1.21.11 quilt
          1.8.9 legacy-fabric
          1.12.2 legacy-fabric
          1.20.1 forge
          1.21.1 neoforge
          EOF
          if [ ${#failures[@]} -gt 0 ]; then
            echo "resolve failed for ${#failures[@]} entries:"
            printf '  %s\n' "${failures[@]}"
            exit 1
          fi

  mod:
    # The companion mod under mod/. The workflow triggers stay as they are; the changes step below makes this job
    # do nothing unless files under mod/ or this workflow changed. It starts no game and runs no in-game tests.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$BEFORE"; fi
          mod=true
          if [ -n "$base" ] && ! echo "$base" | grep -Eq '^0+$'; then
            if files=$(git diff --name-only "$base" HEAD); then
              if echo "$files" | grep -Eq '^(mod/|\.github/workflows/ci\.yml$)'; then mod=true; else mod=false; fi
            fi
          fi
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.mod == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - if: steps.changes.outputs.mod == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mod
      - if: steps.changes.outputs.mod == 'true'
        working-directory: mod
        run: ./gradlew -p common test
      - if: steps.changes.outputs.mod == 'true'
        working-directory: mod
        run: ./gradlew -p legacy test
      - if: steps.changes.outputs.mod == 'true'
        working-directory: mod
        run: ./gradlew -p modern :1.21.11:test :26.3:test
      - if: steps.changes.outputs.mod == 'true'
        working-directory: mod
        run: ./gradlew buildAll
