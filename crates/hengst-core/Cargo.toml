[package]
name = "hengst-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
dev-offline = []

[dependencies]
base64.workspace = true
dirs.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
md-5.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
keyring-core.workspace = true
windows-native-keyring-store.workspace = true
# Win32_Security only because `CreateJobObjectW` takes a `SECURITY_ATTRIBUTES` pointer.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
