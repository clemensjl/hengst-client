# cargo-about configuration for the third-party license list (DESIGN.md 11.10), read by
# `scripts/licenses.mjs`. Every license here can be shipped inside a GPL-3.0-or-later app.
# Anything else (OpenSSL, EPL, CDDL, SSPL, a "non-commercial" license, ...) fails the generation:
# that is a finding to report, never a line to add without checking the compatibility first.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # The app's own crates.
    "GPL-3.0-or-later",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
